<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المهام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-transition">
    <!-- محمل اللغة -->
    <div class="language-loader" id="languageLoader">
        <i class="fas fa-language"></i>
        <p id="loaderText">جاري تغيير اللغة...</p>
    </div>

    <div class="container">
        <header>
            <div class="controls">
                <button class="control-btn theme-toggle" id="themeToggle" title="تبديل وضع الليل/النهار">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="control-btn language-toggle" id="languageToggle" title="تبديل اللغة / Switch Language">
                    <i class="fas fa-language"></i>
                </button>
            </div>
            <h1><i class="fas fa-wind"></i> <span id="appTitle">تطبيق المهام</span></h1>
            <p id="appSubtitle">نظّم مهامك واتخذ الخطوة الأولى نحو الإنجاز</p>
        </header>

        <div class="app-content">
            <!-- قسم إضافة مهمة جديدة -->
            <div class="add-task">
                <h2><i class="fas fa-plus-circle"></i> <span id="addTaskTitle">أضف مهمة جديدة...</span></h2>
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة هنا...">
                    <button class="add-btn" id="addTaskBtn">
                        <i class="fas fa-plus"></i> <span id="addButtonText">إضافة</span>
                    </button>
                </div>
            </div>

            <!-- قسم المهام النشطة -->
            <div class="tasks-section">
                <h2 class="section-title"><i class="fas fa-tasks"></i> <span id="activeTasksTitle">المهام الحالية</span>
                </h2>
                <ul class="task-list" id="activeTasks">
                    <!-- سيتم إضافة المهام النشطة هنا عبر JavaScript -->
                </ul>

                <!-- حالة فارغة -->
                <div class="empty-state" id="emptyActiveTasks">
                    <i class="fas fa-clipboard-list"></i>
                    <p id="emptyActiveText">لا توجد مهام حالية. أضف مهمة جديدة لتبدأ!</p>
                </div>
            </div>

            <!-- قسم المهام المكتملة -->
            <div class="tasks-section completed-tasks">
                <h2 class="section-title"><i class="fas fa-check-circle"></i> <span id="completedTasksTitle">المهام
                        المكتملة</span></h2>
                <ul class="task-list" id="completedTasks">
                    <!-- سيتم إضافة المهام المكتملة هنا عبر JavaScript -->
                </ul>

                <!-- حالة فارغة -->
                <div class="empty-state" id="emptyCompletedTasks">
                    <i class="fas fa-check-double"></i>
                    <p id="emptyCompletedText">لا توجد مهام مكتملة بعد. ابدأ بإنجاز مهامك!</p>
                </div>
            </div>
        </div>

        <footer>
            <p id="footerText">خاتمة الهواء &copy; 2023 - نظم وقتك، حقق أهدافك</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
